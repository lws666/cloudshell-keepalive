name: Cloud Shell 一键启动 DSH + 保活

# 对照 ClawCloud-Run 的 auto_login.yml：
#   ClawCloud 靠 Playwright 登录网页；Cloud Shell 有官方 REST API，
#   所以用 users.environments.start / authorize + cloud-shell ssh 完成保活。
#
# ═══ 为什么不用 "每 25 分钟一次 cron" 做心跳 ═══
#   实测：GitHub 免费额度的 schedule 触发被大幅延迟，实际间隔 4.4-7.7 小时，
#   完全无法压住 Cloud Shell 的 40 分钟空闲线。
#   → 改为「单次 job 内循环 5 小时」：GitHub 单 job 上限 6 小时，
#     一次触发就覆盖整个 5 小时保活窗口，彻底绕开 cron 不准的问题。
#
# ═══ 两种运行方式 ═══
#   1. 手动（推荐）：Actions 页面点 "Run workflow" 按钮
#        - 默认就是「一键启动 DSH + 保活 5 小时」
#        - 只需填 hours（默认 5），点绿色按钮即可
#   2. 自动：cron 每 6 小时尝试开一个窗口
#        - 每 job 5h × 每天 4 次 = 约 20h/周，安全低于 50h 配额
#
# ═══ 三层防线 ═══
#   1. CI 循环  每 20 分钟 poke 一次，持续 5 小时（主防线）
#   2. cron     每 6 小时尝试开一个新窗口
#   3. 远端 ka.sh 进程级保活 DSH(3080)/代理(3081)（配合使用）
#
# 注意：schedule 列表内不要插注释，GitHub 解析器会拒绝注册整个 workflow。

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '保活时长（小时，默认 5，上限 5.5）'
        required: false
        default: '5'
      interval:
        description: '每轮间隔（分钟，默认 20）'
        required: false
        default: '20'
      start_dsh:
        description: '同时启动 DSH(3080) 与代理(3081)'
        required: false
        type: boolean
        default: true

concurrency:
  group: cloudshell-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Write credential
        env:
          GCP_CRED_JSON: ${{ secrets.GCP_CRED_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_CRED_JSON:-}" ]; then
            echo "::error::missing secret GCP_CRED_JSON"
            exit 1
          fi
          umask 077
          printf '%s' "$GCP_CRED_JSON" > "$HOME/.gcp_cred.json"
          echo "credential bytes: $(stat -c%s "$HOME/.gcp_cred.json")"

      - name: Activate credential
        env:
          GCP_CRED_JSON: ${{ secrets.GCP_CRED_JSON }}
        run: |
          set -euo pipefail
          unset CLOUDSDK_CONFIG || true
          TYPE=$(python3 -c "import json,os;print(json.loads(os.environ['GCP_CRED_JSON']).get('type',''))")
          echo "credential type: $TYPE"
          case "$TYPE" in
            service_account)
              gcloud auth activate-service-account --key-file "$HOME/.gcp_cred.json" ;;
            authorized_user)
              ACCT=$(python3 -c "import json,os;b=json.loads(os.environ['GCP_CRED_JSON']);print(b.get('account') or b.get('client_email') or 'ci@local')")
              RT=$(python3 -c "import json,os;print(json.loads(os.environ['GCP_CRED_JSON'])['refresh_token'])")
              gcloud auth activate-refresh-token "$ACCT" "$RT" ;;
            external_account)
              gcloud auth login --cred-file "$HOME/.gcp_cred.json" --brief --quiet ;;
            *)
              echo "::error::unsupported credential type: $TYPE"
              exit 1 ;;
          esac
          gcloud auth list --format='value(account)'

      - name: Set project
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          if [ -n "${GCP_PROJECT:-}" ]; then
            gcloud config set project "$GCP_PROJECT"
            echo "project: $GCP_PROJECT"
          else
            echo "no GCP_PROJECT secret, using default"
          fi

      - name: Sync remote scripts
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          set -euo pipefail
          PROJECT_ARG=""
          [ -n "${GCP_PROJECT:-}" ] && PROJECT_ARG="--project=$GCP_PROJECT"

          gcloud cloud-shell ssh --quiet $PROJECT_ARG --command='mkdir -p $HOME/keepalive' || true

          # 一键启动脚本：优先用仓库内副本，没有就用远端已有的
          if [ -f start/dsh-cloudshell-start.sh ]; then
            echo "sync dsh-cloudshell-start.sh"
            gcloud cloud-shell scp --quiet $PROJECT_ARG \
              "localhost:$PWD/start/dsh-cloudshell-start.sh" "cloudshell:/tmp/dsh-start-sync.sh"
            gcloud cloud-shell ssh --quiet $PROJECT_ARG \
              --command='install -m 755 /tmp/dsh-start-sync.sh $HOME/dsh-cloudshell-start.sh'
          else
            echo "仓库内无 start/dsh-cloudshell-start.sh，使用远端已有版本"
          fi

          # 保活脚本
          for f in scripts/remote/ka.sh scripts/remote/ka-start.sh \
                   scripts/remote/ka-stop.sh scripts/remote/ka-status.sh \
                   scripts/remote/ka-tmux.sh; do
            base=$(basename "$f")
            if [ -f "$f" ]; then
              gcloud cloud-shell scp --quiet $PROJECT_ARG \
                "localhost:$PWD/$f" "cloudshell:/tmp/dsh-$base"
              gcloud cloud-shell ssh --quiet $PROJECT_ARG \
                --command="install -m 755 /tmp/dsh-$base \$HOME/keepalive/$base"
            fi
          done
          echo "remote scripts synced"

      - name: Start DSH on remote
        if: ${{ github.event.inputs.start_dsh != 'false' }}
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          HOURS: ${{ github.event.inputs.hours || '5' }}
        run: |
          set -uo pipefail
          PROJECT_ARG=""
          [ -n "${GCP_PROJECT:-}" ] && PROJECT_ARG="--project=$GCP_PROJECT"

          # ssh --command 是非交互 shell，不加载 ~/.bashrc，PATH 里没有 node。
          # 脚本自身会 resolve_node；这里再补一次作双保险。
          REMOTE_ENV='export PATH=/usr/local/nvm/versions/node/v26.13.0/bin:$PATH;'

          # ═══ 步骤 A: 确保 tmux 保活 worker 存在 ═══
          # 这是关键修复：tmux server 重启后 dsh-keep 会话会消失，
          # 之前的 worker 随之丢失，导致必须人工启动。这里每次敲门都补回来。
          echo "=== 检查 tmux 保活 worker ==="
          set +e
          gcloud cloud-shell ssh --quiet $PROJECT_ARG --command="$REMOTE_ENV
            if tmux has-session -t dsh-keep 2>/dev/null; then
              echo TMUX_WORKER=running
            else
              echo TMUX_WORKER=missing
              if [ -x \$HOME/keepalive/ka-tmux.sh ]; then
                bash \$HOME/keepalive/ka-tmux.sh start 2>&1 | tail -5
                echo TMUX_START_rc=\$?
              else
                echo TMUX_START_rc=no-script
              fi
            fi" > /tmp/tmux-check.log 2>&1
          trc=$?
          set -e
          grep -E "TMUX_WORKER|TMUX_START_rc|已启动|验证隔离|SID" /tmp/tmux-check.log | head -8 || tail -5 /tmp/tmux-check.log
          echo "tmux_check_rc=$trc"

          # ═══ 步骤 B: 启动 DSH（幂等，已在跑则跳过）═══
          echo
          echo "=== 一键启动 DSH（调用 ~/dsh-cloudshell-start.sh）==="
          set +e
          gcloud cloud-shell ssh --quiet $PROJECT_ARG \
            --command="$REMOTE_ENV bash \$HOME/dsh-cloudshell-start.sh" \
            > /tmp/start-dsh.log 2>&1
          rc=$?
          set -e
          tail -25 /tmp/start-dsh.log 2>/dev/null || true
          echo "start_dsh_rc=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error::dsh-cloudshell-start.sh 失败 rc=$rc"
            exit "$rc"
          fi

          # ═══ 步骤 C: 二次确认 3080 真实应答 ═══
          # 同理：只取 3 位数字，避开 gcloud 的尾随警告
          chk=$(gcloud cloud-shell ssh --quiet $PROJECT_ARG \
            --command='curl -s -o /dev/null -w "CODE_%{http_code}\n" --max-time 5 http://127.0.0.1:3080/' 2>/dev/null \
            | tr -d '\r' | grep -oE 'CODE_[0-9]{3}' | head -1 | cut -d_ -f2)
          echo "remote_3080=$chk"
          if [ "$chk" = "000" ] || [ -z "$chk" ]; then
            echo "::error::远端 3080 无应答，DSH 未启动"
            exit 1
          fi

          # ═══ 步骤 D: 确认 tmux worker 真的在跑（保活生效的前提）═══
          # 注意: gcloud 会在末尾追加 "Automatic authentication..." 警告，
          # 直接 tail -1 会取到警告文本（已踩）。必须 grep 精确提取。
          w=$(gcloud cloud-shell ssh --quiet $PROJECT_ARG \
            --command='tmux has-session -t dsh-keep 2>/dev/null && echo WORKER_YES || echo WORKER_NO' 2>/dev/null \
            | tr -d '\r' | grep -oE 'WORKER_(YES|NO)' | head -1)
          echo "tmux_worker_alive=$w"
          if [ "$w" != "WORKER_YES" ]; then
            echo "::warning::tmux worker 未就绪（tmux_worker_alive=$w），保活可能失效"
          fi

      - name: Long-running keepalive loop
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HOURS: ${{ github.event.inputs.hours || '5' }}
          INTERVAL_MIN: ${{ github.event.inputs.interval || '20' }}
        run: python3 scripts/keepalive_loop.py

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloud Shell 保活"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | ${{ github.event_name }} |"
            echo "| 保活时长 | ${{ github.event.inputs.hours || '5' }} 小时 |"
            echo "| 启动 DSH | ${{ github.event.inputs.start_dsh || 'true' }} |"
            echo "| 时间 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
